# rime-actions 配置示例
#
# 用法：把下面 patch: 段里的内容合并进你的 *.custom.yaml，然后「重新部署」。
#       所有项都可以删——删掉就用脚本里的默认值。
#
# 注意：
#   1. 路径、目录名要和你的实际安装位置对上，见 README「安装」。
#   2. 触发码里的字符必须在该方案 speller/alphabet 里（默认含 ` ; / \ 等）。
#   3. 触发码不能重复（包括不能和 actions/trigger 撞码），重复的那些项一律不生效。

customization:
  distribution_code_name: Weasel

patch:
  # ---------- 1. 接线：把 actions.lua 挂到按键处理链最前面 ----------
  # 文件在 lua\myfolder\actions.lua 时，模块名就是 myfolder.actions。
  "engine/processors/@before 0": lua_processor@*myfolder.actions

  # ---------- 2. 组件参数 ----------
  "actions/dll_dir": "lua/myfolder"          # actions.dll 所在目录（相对 Rime 用户目录）

  # ---------- 3. 方式一：文本触发码（默认 qq/）----------
  "actions/trigger": "aa/"
  # 只想用组合键、不要文本触发码时：
  #"actions/trigger": "none"

  # ---------- 4. 方式二：组合键（默认关闭）----------
  #"actions/hotkey": "Control+slash"

  # ---------- 5. 方式三：快捷触发码（默认关闭）----------
  # 启用脚本里预置的 26 项：
  #   z; y; a; c; v; s; x; g; t; w; b; r; h; e; d; kk; aa; dd; ww; hh; tt; gg; xx; ss; ff; f;
  "actions/shortcuts": "@defaults"
  # 只要其中几项（不写 @defaults 就是"只有这几项"）：
  #"actions/shortcuts": "z;=ctrl+z  y;=ctrl+y  ss;=shift+home  ff;=@to-symbol  f;=@search"
  # 预置项 + 自己加的项（混写；注意别和默认的 26 个撞码，撞了那几项都不生效）：
  #"actions/shortcuts": "@defaults eq;=ctrl+end  wq;=ctrl+shift+right"
  # 多步动作：`-` 和 `,` 等价（一步发完、全部松开，按 key_gap_ms 间隔再发下一步）
  #"actions/shortcuts": "sq;=shift+home-shift+left  hh;=shift+home-ctrl+c"

  # ---------- 6. 按键间隔（毫秒，0~500）----------
  # 程序反应不过来、动作只走一半时调大；写 0 = 一口气全发。
  "actions/key_gap_ms": 30

  # ---------- 7. @search 用的搜索引擎（f; 就是它）----------
  # 模板里的 %s 会替换成"最后一次上屏"的原文（已做 percent-encode）。
  "actions/search_url": "https://www.baidu.com/s?wd=%s"
  #"actions/search_url": "https://www.bing.com/search?q=%s"
  #"actions/search_url": "https://www.google.com/search?q=%s"

  # ---------- 8. @to-symbol 认定的"符号" ----------
  "actions/symbols": "，。！？；：、,.!?;:"
  # 只认中文标点：
  #"actions/symbols": "，。！？；：、"
  # 想要"删到本行行首但不删前面的换行"，把换行符 \n 也算进符号集：
  #"actions/symbols": "，。！？；：、\n"

  # ---------- 9. 记账与保护 ----------
  "actions/stack_size": 50                   # 能连续撤回多少笔
  "actions/max_backspaces": 500              # 单次最多删多少字符（不要超过 10000）
  "actions/debounce_ms": 200                 # 连按保护（毫秒），只对方式一（文本触发码）生效

  # ---------- 10. 方式四：AI 模式（默认关闭）----------
  # 打开总开关、填上密钥，并且给一个 @ai 触发码，三样齐了才会工作。
  #"actions/ai/enabled": true
  #"actions/ai/online/api_key": "sk-……"
  #"actions/ai/online/base_url": "https://api.deepseek.com/chat/completions"
  #"actions/ai/online/model": "deepseek-chat"
  #"actions/shortcuts": "@defaults ai;=@ai eng;=@ai:eng jp;=@ai:jp"
  #"actions/ai/send_key": "/"                   # 发送键：单字符=连按两下；组合键（如 ctrl+enter）=按一次
  #"actions/ai/double_ms": 1000                 # 连按判定窗口（毫秒）
  #"actions/ai/replace": false                  # true=先删掉要发的那句再写入结果
  #"actions/ai/history_chars": 200              # 上下文预算（按字符算，0=不带上下文）
  #"actions/ai/clip_key": "ctrl+alt+semicolon"  # 把剪贴板文字发给模型；写 "" 关闭
  # 自定义提示词：
  #"actions/ai/prompts/polish": "你是中文润色助手。把用户给的一句话改写得更通顺，只输出改写后的句子，不要解释。"
  #"actions/shortcuts": "@defaults p;=@ai:polish"
